<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sidney Project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            background-color: #5C8267 !important;
            min-height: 100vh;
            width: 100%;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            color: #FFFFFF !important;
            text-align: center;
        }

        /* Navigation Bar Styles */
        header {
            width: 100%;
            padding: 20px 0;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 0;
        }

        nav a {
            color: #E2EFE0;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: color 0.2s ease;
        }

        nav a:hover,
        nav a.active {
            color: #FFFFFF;
            text-decoration: underline;
        }

        .page-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px 20px 40px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            flex-grow: 1;
        }

        .main-heading {
            font-size: 28px;
            font-weight: 500;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-align: center;
            color: #FFFFFF;
            margin-bottom: 25px;
            width: 100%;
        }

        .logo-container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #FFFFFF;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .logo-image {
            width: 100%;
            max-width: 660px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        footer {
            width: 100%;
            padding: 20px 20px 20px 40px;
            text-align: left;
            font-size: 13px;
            letter-spacing: 1.5px;
            color: #E2EFE0;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="mission.html">Mission</a></li>
                <li><a href="donations.html">Donations</a></li>
                <li><a href="support.html">Support</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-card">
        <h1 class="main-heading">THE SIDNEY PROJECT</h1>

        <div class="logo-container">
            <img src="images/image 5.png" alt="The Sidney Project Logo" class="logo-image">
        </div>
    </main>

    <footer>
        <p>&copy; 2026 OldGuyWebWorks</p>
    </footer>

</body>
</html>
