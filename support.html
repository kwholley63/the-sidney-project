    <style>
        * {
            margin: 0;

            box-sizing: border-box;

            background-color: #5C8267 !important;
            min-height: 100vh;
            width: 100%;
        }

        body {
            font-family: 'Montserrat', sans-serif;

            flex-direction: column;
            align-items: center;
            justify-content: center;

            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            flex-grow: 1;
        }

        h1 {
            font-size: 28px;
            font-weight: 500;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            font-weight: 400;
            line-height: 1.6;
            color: #E2EFE0;
        }

        footer {
            width: 100%;
            padding: 20px 20px 20px 40px;
            text-align: left;
